[project]
name = "yaspin"
version = "3.5.1"
description = "Yet Another Terminal Spinner"
license = "MIT"
authors = [{ name = "Pavlo Dmytrenko", email = "gh@pavdmyt.mozmail.com" }]
readme = "README.md"
keywords = ["spinner", "console", "terminal", "loader", "indicator"]
requires-python = ">=3.11,<4.0"
dependencies = ["termcolor (>=3.3,<4.0)"]
dynamic = ["classifiers"]

[project.urls]
Homepage = "https://github.com/pavdmyt/yaspin"
Repository = "https://github.com/pavdmyt/yaspin"
Documentation = "https://github.com/pavdmyt/yaspin/blob/master/README.md"
"Bug Tracker" = "https://github.com/pavdmyt/yaspin/issues"
Changelog = "https://github.com/pavdmyt/yaspin/releases"

[tool.poetry]
include = [
    { path = "tests", format = "sdist" },
    { path = "examples", format = "sdist" },
    { path = "HISTORY.rst", format = "sdist"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

[tool.poetry.group.dev.dependencies]
mypy = "^2.3"
pytest = "^9.1"
pytest-xdist = "^3.8"
pytest-cov = "^7.1"
pytest-mock = "^3.15"
ruff = "^0.16"

[tool.poetry.group.security]
optional = true

[tool.poetry.group.security.dependencies]
semgrep = "^1.176"

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
pretty = true
disable_error_code = ["annotation-unchecked"]
namespace_packages = false
warn_no_return = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-tidy-imports
    "TID",
    # isort
    "I",
    # mutable-argument-default - Do not use mutable data structures for argument defaults.
    "B006",
]

[tool.ruff.lint.isort]

# Combines as imports on the same line.
combine-as-imports = true

# Whether to place import from imports before straight imports when sorting.
from-first = true

# The number of lines to place between "direct" and 'import from' imports.
lines-between-types = 1

# Put all imports into the same section bucket.
# This configuration breaks the Python convention.
# no-sections = true

# Order imports by type, which is determined by case, in addition to alphabetically.
order-by-type = false
